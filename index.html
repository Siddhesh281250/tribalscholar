<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIBAL SCHOLAR — Prototype</title>
<style>
:root{--navy:#12345b;--blue:#1769aa;--light:#f4f7fb;--line:#dbe3ed;--text:#1c2733;--muted:#667789;--green:#16834b;--amber:#b77900;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--light);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.brand{font-weight:800;color:var(--navy);letter-spacing:.3px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}
.shell{display:flex;min-height:calc(100vh - 64px)}aside{width:245px;background:#fff;border-right:1px solid var(--line);padding:20px 14px}
.navbtn{width:100%;border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:7px;color:#405266;margin:2px 0}.navbtn:hover,.navbtn.active{background:#eaf2fb;color:var(--navy);font-weight:700}
main{flex:1;padding:28px;max-width:1500px;margin:auto;width:100%}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
h1{font-size:25px;margin:0 0 5px;color:var(--navy)}h2{font-size:18px;margin:0 0 15px;color:var(--navy)}h3{font-size:15px;margin:0 0 9px}.muted{color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 1px 2px #12233a08}.kpi{font-size:26px;font-weight:800;color:var(--navy);margin-top:6px}.label{font-size:12px;color:var(--muted)}
.btn{border:1px solid #b9c8d8;background:#fff;color:var(--navy);padding:9px 14px;border-radius:7px;font-weight:700}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.success{background:#eaf7f0;border-color:#b7e2c8;color:var(--green)}.btn.warn{background:#fff6df;border-color:#ecd394;color:var(--amber)}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2f6;color:#506174}.badge.green{background:#e8f7ef;color:var(--green)}.badge.amber{background:#fff5d9;color:var(--amber)}.badge.red{background:#fdeceb;color:var(--red)}.progress{height:8px;background:#e7edf3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}
.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.stack>*+*{margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.timeline{display:flex;gap:0;overflow:auto;margin:18px 0}.step{min-width:120px;text-align:center;position:relative;padding:0 5px}.step:before{content:"";height:2px;background:#cbd6e2;position:absolute;top:11px;left:50%;right:-50%;z-index:0}.step:last-child:before{display:none}.dot{width:23px;height:23px;border:2px solid #aebdcd;background:#fff;border-radius:50%;margin:0 auto 7px;position:relative;z-index:1}.done .dot{background:var(--green);border-color:var(--green)}.done .dot:after{content:"✓";color:#fff;font-size:12px;position:absolute;left:4px;top:1px}.current .dot{border-color:var(--blue);box-shadow:0 0 0 4px #dcecf9}
input,select{width:100%;padding:10px;border:1px solid #cbd6e2;border-radius:6px;background:#fff}.field{margin-bottom:12px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
.alert{padding:12px 14px;border-radius:7px;background:#fff6df;border:1px solid #ecd394;font-size:13px}.info{background:#edf6ff;border-color:#c5def3}.successbox{background:#eaf7f0;border:1px solid #b7e2c8;padding:14px;border-radius:7px}
.hero{background:#fff;border:1px solid var(--line);padding:30px;border-radius:12px;margin-bottom:18px}.hero h1{font-size:30px}.hero p{max-width:780px;line-height:1.6;color:#526579}
.actions{display:flex;gap:9px;flex-wrap:wrap}.hidden{display:none!important}.search{max-width:360px}
.statline{display:flex;align-items:center;gap:12px}.statline span:first-child{width:145px;font-size:12px}.bar{flex:1;height:9px;background:#e8edf2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2f78b7}
.login{max-width:500px;margin:55px auto}.login .card{padding:28px}
.footer{font-size:11px;color:var(--muted);margin-top:28px;text-align:center}
@media(max-width:900px){aside{width:190px}.g4,.g3{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){aside{display:none}main{padding:16px}.g4,.g3,.g2{grid-template-columns:1fr}.top{padding:0 15px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const state={
 role:"applicant", page:"dashboard", profile:82, application:"Under Scrutiny",
 deficiency:false, docUploaded:false, verified:false, payment:"Processing",
 eligibility:null, grievance:null
};
const schemes=[
 {name:"National Fellowship for ST Students",type:"Fellowship",level:"Higher Education / Research",match:94,status:"Applications Open"},
 {name:"National Overseas Scholarship",type:"Scholarship",level:"Postgraduate / PhD / Post-Doctoral",match:87,status:"Applications Open"},
 {name:"Post-Matric Scholarship",type:"Scholarship",level:"Higher Education",match:91,status:"Applications Open"},
 {name:"Pre-Matric Scholarship",type:"Scholarship",level:"School Education",match:72,status:"Applications Open"},
 {name:"Top Class Education Support",type:"Scholarship",level:"Higher Education",match:83,status:"Applications Open"}
];
const stages=["Submitted","AI Screening","Eligibility","Verification","Scrutiny","Selection","Sanction","DBT"];
function nav(){return state.role==="applicant"?[
["dashboard","Dashboard"],["profile","My Profile"],["schemes","Find Schemes"],["applications","My Applications"],["documents","Documents"],["payments","Payments"],["fellowship","Fellowship"],["grievances","Grievances"],["help","Help & FAQs"]
]:[
["admin","Overview"],["queue","Application Queue"],["intelligence","Application Intelligence"],["selection","Selection"],["payments","Payments"],["analytics","Analytics"],["grievances","Grievances"],["audit","Audit Logs"],["config","Scheme Configuration"]
]}
function layout(content){
return `<header class="top"><div class="brand">TRIBAL SCHOLAR<small>Ministry of Tribal Affairs · Government of India</small></div>
<div class="actions"><span class="badge amber">PROTOTYPE — DEMONSTRATION DATA</span><button class="btn" onclick="switchRole()">${state.role==="applicant"?"Officer View":"Applicant View"}</button></div></header>
<div class="shell"><aside>${nav().map(x=>`<button class="navbtn ${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
<div style="margin-top:22px;padding:12px;border-top:1px solid var(--line)"><div class="muted">Signed in as</div><b>${state.role==="applicant"?"student@demo.gov.in":"officer@demo.gov.in"}</b></div></aside><main>${content}<div class="footer">Prototype only. AI outputs are decision-support signals; authorized officials make final decisions. No live PFMS/DBT/Aadhaar integration is claimed.</div></main></div>`;
}
function head(title,sub=""){return `<div class="pagehead"><div><h1>${title}</h1><div class="muted">${sub}</div></div></div>`}
function dashboard(){
let step=state.application==="Deficient"?3:state.application==="Resubmitted"?4:state.application==="Verified"?5:2;
return `<div class="hero"><h1>Empowering Tribal Students Through Smarter Scholarship Administration</h1><p>A unified AI-enabled workflow for transparent, efficient and accountable scholarship and fellowship management.</p><div class="actions"><button class="btn primary" onclick="go('schemes')">Find a Scheme</button><button class="btn" onclick="checkEligibility()">Check Eligibility</button></div></div>
${head("Applicant Dashboard","Your scholarship and fellowship journey in one place.")}
<div class="grid g4">
<div class="card"><div class="label">Profile Completion</div><div class="kpi">${state.profile}%</div><div class="progress"><i style="width:${state.profile}%"></i></div><div class="muted" style="margin-top:9px">Missing: bank verification, income certificate</div></div>
<div class="card"><div class="label">Active Application</div><div class="kpi">1</div><div class="badge amber">${state.application}</div></div>
<div class="card"><div class="label">Eligibility Match</div><div class="kpi">${state.eligibility||94}%</div><div class="muted">Preliminary AI assessment</div></div>
<div class="card"><div class="label">Payment</div><div class="kpi">₹XX,XXX</div><div class="badge ${state.payment==="Paid"?"green":"amber"}">${state.payment}</div></div>
</div>
<div class="card" style="margin-top:16px"><div class="row"><div><h2>National Fellowship for ST Students</h2><div class="muted">Application MOTA-NFST-2026-00124</div></div><span class="badge amber">${state.application}</span></div>
<div class="timeline">${stages.map((s,i)=>`<div class="step ${i<step?'done':''} ${i===step?'current':''}"><div class="dot"></div><div class="muted">${s}</div></div>`).join("")}</div>
${state.deficiency?`<div class="alert"><b>Action required:</b> Income certificate is unclear / unreadable. <button class="btn warn" onclick="go('documents')" style="margin-left:8px">Upload New Document</button></div>`:""}
</div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h2>Schemes You May Be Eligible For</h2>${schemes.slice(0,3).map(s=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${s.name}</b><div class="muted">${s.level}</div></div><span class="badge green">${s.match}% match</span></div>`).join("")}</div>
<div class="card"><h2>AI Verification Summary</h2><div class="stack"><div class="statline"><span>Document completeness</span><div class="bar"><i style="width:96%"></i></div><b>96%</b></div><div class="statline"><span>Data consistency</span><div class="bar"><i style="width:98%"></i></div><b>98%</b></div><div class="statline"><span>Verification confidence</span><div class="bar"><i style="width:91%"></i></div><b>91%</b></div></div><div class="alert info" style="margin-top:15px">AI assists with extraction, comparison and flagging. It does not make final eligibility or selection decisions.</div></div></div>`;
}
function schemesPage(){return `${head("Find Scholarships & Fellowships","Discover schemes and run a preliminary eligibility assessment.")}<div class="card"><div class="row"><input class="search" placeholder="Search schemes..." oninput="filterSchemes(this.value)"><select class="search"><option>All education levels</option><option>Higher Education</option><option>Research</option></select></div><div id="schemeList" class="grid g2" style="margin-top:16px">${schemeCards(schemes)}</div></div>`}
function schemeCards(arr){return arr.map((s,i)=>`<div class="card"><div class="row"><span class="badge">${s.type}</span><span class="badge green">${s.status}</span></div><h2 style="margin-top:12px">${s.name}</h2><div class="muted">${s.level}</div><div style="margin:15px 0"><b>AI preliminary match: ${s.match}%</b><div class="progress" style="margin-top:6px"><i style="width:${s.match}%"></i></div></div><div class="actions"><button class="btn primary" onclick="checkEligibility()">Check Eligibility</button><button class="btn" onclick="startApplication()">Start Application</button></div></div>`).join("")}
function eligibility(){return `${head("AI Scheme Eligibility Assistant","Preliminary assessment against configured demo rules.")}<div class="grid g2"><div class="card"><h2>Applicant Inputs</h2>
${["ST status","Annual family income","Education level","Academic percentage / CGPA","Institution","Admission status"].map((x,i)=>`<div class="field"><label>${x}</label>${i===0?`<select><option>Yes — ST</option></select>`:i===1?`<input value="240000">`:i===2?`<select><option>Higher Education</option></select>`:i===3?`<input value="82">`:i===4?`<input value="Demo University">`:`<select><option>Confirmed</option></select>`}</div>`).join("")}<button class="btn primary" onclick="runEligibility()">Run Eligibility Check</button></div>
<div class="card">${state.eligibility?`<span class="badge green">LIKELY ELIGIBLE</span><div class="kpi" style="margin-top:12px">${state.eligibility}%</div><div class="muted">Preliminary eligibility match</div><h2 style="margin-top:22px">Eligibility Breakdown</h2>${["ST eligibility requirement","Academic requirement","Income requirement","Course requirement","Institution requirement"].map(x=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">✓ ${x}</div>`).join("")}<div class="alert" style="margin-top:14px">⚠ Admission proof should be verified before final scrutiny.</div><p class="muted">AI-based preliminary assessment. Final eligibility is determined according to applicable scheme guidelines and official verification.</p><div class="actions"><button class="btn primary" onclick="startApplication()">Start Application</button><button class="btn" onclick="go('schemes')">View Eligibility Rules</button></div>`:`<div class="alert info">Enter/select applicant information and run the checker. The prototype uses configurable demonstration rules.</div>`}</div></div>`}
function application(){return `${head("Application — National Fellowship","MOTA-NFST-2026-00124")}<div class="card"><div class="timeline">${["Personal","Academic","Financial","Bank","Scheme Details","Documents","Review","Submit"].map((s,i)=>`<div class="step ${i<6?'done':''} ${i===6?'current':''}"><div class="dot"></div><div class="muted">${s}</div></div>`).join("")}</div><div class="grid g2"><div><h2>Personal & Academic Details</h2><div class="field"><label>Full Name</label><input value="Rahul Kumar"></div><div class="field"><label>Education</label><input value="PhD — Computer Science"></div><div class="field"><label>Institution</label><input value="Demo University"></div><div class="field"><label>Academic Score</label><input value="82%"></div></div><div><h2>Application Readiness</h2><div class="kpi">96%</div><div class="progress"><i style="width:96%"></i></div><div class="stack" style="margin-top:14px">${["Personal details","Academic details","Financial details","Bank verification"].map(x=>`<div>✓ ${x}</div>`).join("")}</div></div></div><div class="actions" style="margin-top:20px"><button class="btn primary" onclick="submitApplication()">Submit Application</button><button class="btn" onclick="go('documents')">Review Documents</button></div></div>`}
function documents(){return `${head("Documents & AI Verification","Upload, inspect and respond to document findings.")}<div class="grid g2"><div class="card"><h2>Income_Certificate.pdf</h2><div class="badge ${state.docUploaded?'green':'amber'}">${state.docUploaded?'AI Analysis Complete':'Awaiting Upload'}</div>${state.docUploaded?`<div class="stack" style="margin-top:16px"><div><b>Applicant Name</b><br>Rahul Kumar</div><div><b>Certificate Number</b><br>INC23455</div><div><b>Income</b><br>₹2,40,000</div><div><b>Issuing Authority</b><br>Demo District Authority</div></div>`:`<p class="muted">Drag and drop a document or use the demo upload button.</p>`}<div class="actions" style="margin-top:18px"><button class="btn primary" onclick="uploadDoc()">Upload Demo Document</button></div></div>
<div class="card"><h2>AI Document Verification</h2>${state.docUploaded?`<div class="successbox"><b>Document Consistency: 98%</b><p class="muted">Extracted fields are consistent with the current application.</p></div><h3 style="margin-top:18px">Risk Analysis</h3><div class="badge green">LOW RISK</div><p class="muted">No automatic fraud decision is made. Anomalies, if any, are sent for human review.</p>`:`<div class="alert info">Upload a document to demonstrate OCR extraction, cross-field comparison and anomaly review.</div>`}</div></div>
<div class="card" style="margin-top:16px"><h2>Deficiency Resolution</h2>${state.deficiency?`<div class="alert"><b>Income certificate is unclear / unreadable.</b><br>Required action: Upload a clearer document.</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="resubmit()">Resubmit Corrected Document</button></div>`:`<div class="muted">No active deficiency. Officer-raised issues will appear here.</div>`}</div>`}
function admin(){return `${head("Ministry Overview","Operational view of scholarship and fellowship administration.")}<div class="grid g4">${[["Total Applications","124,680"],["Under Verification","18,420"],["Deficient Applications","6,284"],["Eligible Applications","92,140"]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="kpi">${x[1]}</div></div>`).join("")}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h2>Verification Pipeline</h2>${["Submitted","AI Verified","Deficient","Eligible","Selected","Paid"].map((x,i)=>`<div class="statline" style="margin:14px 0"><span>${x}</span><div class="bar"><i style="width:${95-i*11}%"></i></div><b>${[124680,108300,6284,92140,12450,9820][i].toLocaleString()}</b></div>`).join("")}</div><div class="card"><h2>AI Operational Insights</h2><div class="alert info">Demo insight: document verification workload increased by 18% this week.</div><div class="alert info" style="margin-top:10px">Demo insight: income-certificate deficiencies are highest in Scheme X.</div><div class="alert info" style="margin-top:10px">Demo insight: average verification time has increased at the document scrutiny stage.</div><p class="muted">These are prototype analytics based on fictional data.</p></div></div>`}
function queue(){return `${head("Application Queue","Review, assign and process applications with human oversight.")}<div class="card"><table><thead><tr><th>Application</th><th>Applicant</th><th>Scheme</th><th>Eligibility</th><th>AI Flag</th><th>Stage</th><th>Action</th></tr></thead><tbody><tr><td>MOTA-NFST-2026-00124</td><td>Rahul Kumar</td><td>National Fellowship</td><td><span class="badge green">94%</span></td><td><span class="badge amber">Income mismatch</span></td><td>${state.application}</td><td><button class="btn" onclick="go('intelligence')">View</button></td></tr><tr><td>MOTA-NOS-2026-000842</td><td>Demo Applicant</td><td>National Overseas Scholarship</td><td><span class="badge green">87%</span></td><td><span class="badge green">None</span></td><td>Eligibility</td><td><button class="btn">View</button></td></tr></tbody></table></div>`}
function intelligence(){return `${head("Application Intelligence Center","Human-in-the-loop review workspace.")}<div class="card"><div class="row"><div><h2>Application: MOTA-NFST-2026-00124</h2><div class="muted">Applicant: Rahul Kumar · National Fellowship</div></div><span class="badge amber">${state.application}</span></div><div class="grid g4" style="margin-top:18px">${[["Eligibility Match","94%"],["Document Completeness","96%"],["Data Consistency","98%"],["AI Risk Indicator","LOW"]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="kpi">${x[1]}</div></div>`).join("")}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h2>Document Analysis</h2>${["ST Certificate ✓","Income Certificate ⚠","Marksheet ✓","Admission Proof ✓","Bank Details ✓"].map(x=>`<div style="padding:11px;border-bottom:1px solid var(--line)">${x}</div>`).join("")}</div><div class="card"><h2>AI Findings</h2><div class="alert"><b>Income mismatch detected.</b><br>Application: ₹2,40,000<br>Certificate: ₹2,60,000<br><br><b>Recommended action:</b> Request clarification.</div><div class="actions" style="margin-top:14px"><button class="btn success" onclick="verify()">Verify</button><button class="btn warn" onclick="raiseDeficiency()">Raise Deficiency</button><button class="btn" onclick="verify()">Request Clarification</button></div><p class="muted">AI recommendation ≠ final decision.</p></div></div><div class="card" style="margin-top:16px"><h2>Audit Trail</h2><div class="muted">09:42 — Application submitted</div><div class="muted">09:43 — AI screening completed</div><div class="muted">09:44 — Income mismatch detected</div><div class="muted">09:46 — Assigned to Officer #204</div></div></div>`}
function selection(){return `${head("Selection Management","Generate a provisional selection list using configured rules; require authorized approval.")}<div class="card"><div class="row"><div><h2>NFST 2026–27 · Eligible Applicants</h2><div class="muted">Demo data only</div></div><button class="btn primary" onclick="alert('Demo provisional merit/selection list generated. Authorized human approval is still required.')">Generate Provisional List</button></div><table style="margin-top:14px"><thead><tr><th>Applicant</th><th>Academic</th><th>Research</th><th>Expert Score</th><th>Status</th></tr></thead><tbody><tr><td>Rahul Kumar</td><td>82</td><td>88</td><td>—</td><td><span class="badge amber">Pending committee</span></td></tr><tr><td>Demo Applicant 2</td><td>86</td><td>81</td><td>—</td><td><span class="badge green">Eligible</span></td></tr></tbody></table></div>`}
function payments(){return `${head("Payment & DBT Tracking","Prototype payment lifecycle. No live government integration is claimed.")}<div class="card"><h2>MOTA-NFST-2026-00124</h2><div class="timeline">${["Sanctioned","PFMS Submitted","Payment Processing","Paid"].map((x,i)=>`<div class="step ${state.payment==="Paid"||i<2?'done':i===2?'current':''}"><div class="dot"></div><div class="muted">${x}</div></div>`).join("")}</div><div class="grid g3"><div><div class="label">Sanction amount</div><b>₹XX,XXX</b></div><div><div class="label">Reference ID</div><b>DEMO-PFMS-2026-00842</b></div><div><div class="label">Status</div><span class="badge amber">${state.payment}</span></div></div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="processPayment()">Process Demo Payment</button></div><div class="alert info" style="margin-top:14px">Demo PFMS Integration — simulated status only.</div></div>`}
function analytics(){return `${head("Analytics","Operational analytics from fictional prototype data.")}<div class="grid g2"><div class="card"><h2>Applications by State</h2>${["Madhya Pradesh","Maharashtra","Odisha","Jharkhand","Chhattisgarh"].map((x,i)=>`<div class="statline" style="margin:14px 0"><span>${x}</span><div class="bar"><i style="width:${90-i*14}%"></i></div><b>${[24800,21800,17400,15100,12900][i].toLocaleString()}</b></div>`).join("")}</div><div class="card"><h2>Processing Bottlenecks</h2>${["Document Verification","Official Scrutiny","Eligibility","Sanction","Payment"].map((x,i)=>`<div class="statline" style="margin:14px 0"><span>${x}</span><div class="bar"><i style="width:${84-i*12}%"></i></div><b>${[4.8,3.9,2.1,1.6,1.2][i]} days</b></div>`).join("")}</div></div><div class="card" style="margin-top:16px"><h2>Deficiency Analysis</h2><div class="grid g2">${["Missing certificate","Invalid document","Name mismatch","Expired document","Incorrect information"].map((x,i)=>`<div class="row"><span>${x}</span><b>${[1840,1320,980,640,510][i]}</b></div>`).join("")}</div></div>`}
function grievances(){return `${head("Grievance & Helpdesk","Raise and track applicant support tickets.")}<div class="card"><div class="row"><div><h2>${state.grievance||"No active grievance"}</h2><div class="muted">${state.grievance?"GRV-2026-004829 · Under Review":"Create a ticket for application, payment, eligibility or technical issues."}</div></div><button class="btn primary" onclick="raiseGrievance()">Raise Grievance</button></div>${state.grievance?`<div class="timeline" style="margin-top:25px">${["Submitted","Assigned","Under Investigation","Response","Resolved"].map((x,i)=>`<div class="step ${i<2?'done':i===2?'current':''}"><div class="dot"></div><div class="muted">${x}</div></div>`).join("")}</div>`:""}</div>`}
function generic(title,body){return `${head(title)}<div class="card">${body}</div>`}
function render(){
let c="";
if(state.role==="applicant"){
if(state.page==="dashboard")c=dashboard(); else if(state.page==="schemes")c=schemesPage(); else if(state.page==="eligibility")c=eligibility(); else if(state.page==="application")c=application(); else if(state.page==="documents")c=documents(); else if(state.page==="payments")c=payments(); else if(state.page==="grievances")c=grievances(); else if(state.page==="applications")c=generic("My Applications",`<h2>MOTA-NFST-2026-00124</h2><span class="badge amber">${state.application}</span><p class="muted">Open the dashboard to view the complete application timeline.</p>`); else if(state.page==="fellowship")c=generic("My Fellowship",`<h2>Fellowship Status: Active</h2><p>Research: Computer Science · Demo University · 2026–2029</p><div class="successbox">Installment Apr–Jun: Paid · Jul–Sep: Processing · Oct–Dec: Upcoming</div>`); else c=generic(state.page==="profile"?"My Profile":"Help & FAQs",`<p class="muted">Prototype section. Use the dashboard and workflow screens for the main demonstration.</p>`);
}else{
if(state.page==="admin")c=admin(); else if(state.page==="queue")c=queue(); else if(state.page==="intelligence")c=intelligence(); else if(state.page==="selection")c=selection(); else if(state.page==="payments")c=payments(); else if(state.page==="analytics")c=analytics(); else if(state.page==="grievances")c=grievances(); else if(state.page==="audit")c=generic("Audit Logs",`<h2>Immutable-style activity trail</h2><p>09:43 — AI screening completed</p><p>09:44 — Income mismatch detected</p><p>09:46 — Assigned to Officer #204</p><p>11:32 — Applicant uploaded revised document</p><p>12:15 — Officer B completed verification</p>`); else c=generic("Scheme Configuration Engine",`<h2>NFST 2026–27 · Version 3</h2><p class="muted">Visual rule builder concept</p><div class="alert info">IF Category = ST AND Annual Income ≤ configured limit AND Education Level = configured level THEN Preliminary Eligibility = TRUE</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="alert('Demo rule impact: approximately 8,420 fictional applications could be affected.')">Preview Rule Impact</button></div>`);
}
document.getElementById("app").innerHTML=layout(c);
}
function go(p){state.page=p;render()}
function switchRole(){state.role=state.role==="applicant"?"officer":"applicant";state.page=state.role==="applicant"?"dashboard":"admin";render()}
function checkEligibility(){state.page="eligibility";render()}
function runEligibility(){state.eligibility=94;render()}
function startApplication(){state.page="application";render()}
function submitApplication(){state.application="Under Scrutiny";state.page="dashboard";render()}
function uploadDoc(){state.docUploaded=true;render()}
function raiseDeficiency(){state.deficiency=true;state.application="Deficient";alert("Demo deficiency created and applicant notified.");render()}
function resubmit(){state.deficiency=false;state.application="Resubmitted";alert("Corrected document submitted. Application returned to officer queue.");render()}
function verify(){state.verified=true;state.application="Verified";alert("Demo human verification completed.");render()}
function processPayment(){state.payment="Paid";alert("Demo payment status changed to Paid.");render()}
function raiseGrievance(){state.grievance="Payment status clarification";alert("Demo grievance GRV-2026-004829 created.");render()}
function filterSchemes(q){let a=schemes.filter(s=>s.name.toLowerCase().includes(q.toLowerCase()));document.getElementById("schemeList").innerHTML=schemeCards(a)}
render();
</script>
